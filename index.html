<!DOCTYPE html>
<html>
<head>
    <title>Vi Voice Studio</title>
    <style>/* Your CSS for pro look */</style>
</head>
<body>
    <h1>🎙️ TTS Podcast Maker</h1>
    <textarea id="text" placeholder="Paste text..."></textarea>
    <select id="voice"><!-- Voices --></select>
    <button onclick="generateTTS()">Generate Audio</button>
    <audio id="player" controls></audio>
    <a id="download">Download MP3</a>

    <script>
        async function generateTTS() {
            const text = document.getElementById('text').value;
            const form = new FormData();
            form.append('text', text);
            form.append('voice', document.getElementById('voice').value);
            
            const res = await fetch('/tts', {method: 'POST', body: form});
            const audioBlob = await res.blob();
            const url = URL.createObjectURL(audioBlob);
            
            document.getElementById('player').src = url;
            document.getElementById('download').href = url;
            document.getElementById('download').download = 'podcast.mp3';
        }
    </script>
</body>
</html>
